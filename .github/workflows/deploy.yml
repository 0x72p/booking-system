name: Deploy Booking System

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Stop existing container
        run: docker stop booking-system-container || true

      - name: Remove old container
        run: docker rm booking-system-container || true

      - name: Build new image
        run: docker build -t booking-system .

      - name: Run new container
        run: docker run -d --name booking-system-container -p 5001:5000 booking-system

      - name: Start Cloudflare tunnel
        run: |
          pkill cloudflared || true
          nohup cloudflared tunnel --url http://localhost:5001 > /tmp/cloudflared.log 2>&1 &
          sleep 5
          cat /tmp/cloudflared.log